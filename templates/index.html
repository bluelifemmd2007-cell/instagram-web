<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Instagram Profile Downloader</title>
</head>
<body>
    <h1>Instagram Profile Picture Downloader</h1>

    <form method="POST">
        <input type="text" name="username" placeholder="Enter Instagram username" required>
        <button type="submit">Search</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if profile_pic_url %}
        <h2>Profile Picture:</h2>
        <img src="{{ profile_pic_url }}" width="300">
    {% endif %}
</body>
</html>
